[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenet"
version = "0.1.0"
description = "Local-first token efficiency layer for AI coding assistants"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "tree-sitter==0.21.*",
    "tree-sitter-languages==1.10.*",
    "networkx==3.3",
    "fastapi==0.115.*",
    "uvicorn==0.30.*",
    "pydantic>=2,<3",
    "sqlite-utils==3.36.*",
    "sentence-transformers==3.*",
    "ollama==0.3.*",
    "typer>=0.12",
    "pyyaml==6.*",
    "pytest==8.*",
    "watchdog>=4.0",
    "numpy>=1.24",
    "httpx>=0.27",
    "rich>=13.0",
    "aiofiles>=23.0",
]

[project.scripts]
tenet = "tenet.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["tenet"]
