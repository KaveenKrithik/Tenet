[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tenet"
version = "0.1.0"
description = "Local-first token efficiency layer for AI coding assistants"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "tree-sitter>=0.21.0,<0.22.0",
    "tree-sitter-languages>=1.10.0,<1.11.0",
    "networkx>=3.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.0,<3.0",
    "sqlite-utils>=3.35",
    "sentence-transformers>=3.0.0",
    "ollama>=0.3.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "pytest>=8.0.0",
    "watchdog>=4.0.0",
    "numpy>=1.24.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "aiofiles>=23.0.0",
]

[project.scripts]
tenet = "tenet.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.hatch.build.targets.wheel]
packages = ["tenet"]
